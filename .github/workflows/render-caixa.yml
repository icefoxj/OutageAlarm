name: Renderizar caixa (OpenSCAD)

# Gera os STLs e as imagens da caixa sempre que o projeto mecânico muda.
# Resultado: artefato "caixa-render" na página da execução.
# Baixar localmente:  gh run download --name caixa-render --dir <pasta>

on:
  push:
    paths:
      - "hardware/mecanica/*.scad"
      - ".github/workflows/render-caixa.yml"
  pull_request:
    paths:
      - "hardware/mecanica/*.scad"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar OpenSCAD
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openscad fonts-liberation xvfb xauth

      - name: Gerar STLs
        working-directory: hardware/mecanica
        run: |
          mkdir -p stl
          openscad --hardwarnings -o stl/caixa_base.stl  -D 'parte="base"'  caixa.scad
          openscad --hardwarnings -o stl/caixa_tampa.stl -D 'parte="tampa"' caixa.scad

      - name: Gerar imagens
        working-directory: hardware/mecanica
        run: |
          mkdir -p img
          # nome  parte  rot_x  rot_z
          render() {
            xvfb-run -a openscad -o "img/$1.png" -D "parte=\"$2\"" \
              --imgsize=1200,900 --colorscheme=Tomorrow --autocenter --viewall \
              --camera=0,0,0,$3,0,$4,0 caixa.scad
          }
          render montagem  montagem  60 25
          render traseira  montagem  60 205
          render explodida explodida 65 25
          render base      base      40 25
          render tampa     tampa     40 25

      - uses: actions/upload-artifact@v7
        with:
          name: caixa-render
          path: |
            hardware/mecanica/stl/*.stl
            hardware/mecanica/img/*.png
          if-no-files-found: error
